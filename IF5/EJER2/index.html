<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>IMPULSO UI</title>

    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <header>

        <h1>IMPULSO UI</h1>

        <p>
            Mi pequeño framework CSS con Sass
        </p>

    </header>


    <main class="productos">

        <div class="card">

            <h3>Polo Básico</h3>

            <p>
                Polo de algodón para uso diario.
            </p>

            <p class="precio">
                S/ 35.00
            </p>

            <p class="estado-disponible">
                Disponible
            </p>

            <button class="btn-comprar">
                Comprar
            </button>

        </div>


        <div class="card">

            <h3>Casaca Urbana</h3>

            <p>
                Casaca ligera para cualquier ocasión.
            </p>

            <p class="precio">
                S/ 80.00
            </p>

            <p class="estado-oferta">
                En oferta
            </p>

            <button class="btn-oferta">
                Ver oferta
            </button>

        </div>


        <div class="card">

            <h3>Zapatillas</h3>

            <p>
                Zapatillas cómodas para uso diario.
            </p>

            <p class="precio">
                S/ 120.00
            </p>

            <p class="estado-agotado">
                Agotado
            </p>

            <button class="btn-comprar">
                Comprar
            </button>

        </div>

    </main>

</body>

</html>
